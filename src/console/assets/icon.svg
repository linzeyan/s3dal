<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Corner radius is 22.37% of the edge, the same mask the profile README
       clips every icon with, so the two edges coincide there. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bb3a3"/>
      <stop offset="1" stop-color="#0b5c55"/>
    </linearGradient>
    <!-- Gaps are cut out rather than painted so the gradient shows through.
         Parabolas, not elliptical arcs: an arc ends with a vertical tangent,
         which notches the sides. These cross the sides where the bucket's
         cross-section would and sag as much in the middle, spaced so the
         three bands come out equally thick. -->
    <mask id="layers">
      <rect width="256" height="256" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="12">
        <path d="M30 97.7Q128 168.3 226 97.7"/>
        <path d="M30 128.7Q128 206.9 226 128.7"/>
      </g>
    </mask>
  </defs>
  <rect width="256" height="256" rx="57.3" fill="url(#bg)"/>
  <g fill="#fff" mask="url(#layers)">
    <path d="M48 82L68 180A60 16 0 0 0 188 180L208 82Z"/>
    <ellipse cx="128" cy="82" rx="80" ry="22"/>
  </g>
  <ellipse cx="128" cy="82" rx="66" ry="13" fill="#0b4f49"/>
</svg>
