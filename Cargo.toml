[package]
name = "s3dal"
version = "0.1.0"
edition = "2024"
# s3s 0.17 requires 1.96.
rust-version = "1.96"
license = "Apache-2.0"
description = "Expose any Apache OpenDAL backend as an S3-compatible endpoint"
repository = "https://github.com/linzeyan/s3dal"
readme = "README.md"
keywords = ["s3", "s3-compatible", "opendal", "object-storage", "gateway"]
categories = ["command-line-utilities", "network-programming", "web-programming::http-server"]
# An allowlist, so the package holds only what builds and documents the crate. Tests, scripts
# and compat/ results are for development in a checkout; NOTICE must travel with the code
# adapted from s3s.
include = [
    "/src/",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
]

[features]
default = ["services-s3", "services-azblob", "services-gcs"]
# A remote service brings OpenDAL's HTTP transport with it; fs alone needs none, so each one
# that s3dal is tested against is a feature that a build can leave out.
services-s3 = ["opendal/services-s3", "opendal/http-transport-reqwest"]
services-azblob = ["opendal/services-azblob", "opendal/http-transport-reqwest"]
services-gcs = ["opendal/services-gcs", "opendal/http-transport-reqwest"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
# Already compiled for s3s. Continuation tokens are base64url of the last listed name, and
# Content-MD5 is base64 of the digest.
base64-simd = "0.8"
bytes = "1"
# `string`: values read from the config file become flag defaults at runtime.
clap = { version = "4.6", features = ["derive", "env", "string"] }
futures = "0.3"
# Already compiled for s3s; wraps its service to fix up request headers before s3s parses them.
hyper = "1"
hyper-util = { version = "0.1.20", features = ["server-auto", "http1", "http2", "tokio"] }
md-5 = "0.11"
opendal = { version = "0.59.4", default-features = false, features = ["services-fs", "services-memory", "executors-tokio", "layers-retry"] }
s3s = "0.17.0"
# Already compiled for s3s, which decodes and encodes x-amz-meta-* values with it; s3dal stores
# them in the same encoded form.
s3s-rfc2047 = "0.17.0"
# Already compiled for opendal-core. Multipart uploads keep their state in small JSON files.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Already compiled for tokio, with `all`. Sets TCP keepalive timing on accepted sockets, which
# tokio does not expose, without unsafe setsockopt calls and the per-OS option names.
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# Already compiled for OpenDAL's s3 service (reqwest's TLS), with the same aws-lc-rs provider.
# Serves HTTPS, and re-exports rustls and its PEM parser.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
# The `serve --config` file. Only parsing: s3dal never writes TOML.
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
aws-credential-types = { version = "1.3", features = ["hardcoded-credentials"] }
aws-sdk-s3 = { version = "1.143", features = ["behavior-version-latest"] }
# Already compiled for aws-sdk-s3; HTTPS tests give the SDK a client that trusts the test
# certificate.
aws-smithy-http-client = { version = "1.5", features = ["rustls-aws-lc"] }
# Already compiled for hyper. Connection tests speak HTTP/2 directly, to see a GOAWAY and to hold
# a request open halfway through its body, which the SDK does not expose.
h2 = "0.4"
# Already compiled for s3s. Browser form uploads are signed by the app's backend, not an SDK, so
# the tests sign their POST policies with HMAC-SHA256 themselves.
hmac = "0.13"
# Every test runs its own tokio runtime, and a pooled connection dies with the runtime that
# opened it, so each test backend gets an HTTP client of its own instead of OpenDAL's
# process-wide one. Both are already compiled for OpenDAL's s3 service.
opendal-http-transport-reqwest = "0.59.4"
reqwest = { version = "0.13.4", default-features = false }
# Generates TLS test certificates at test time, so no private key or expiry date is committed.
# Signs with the aws-lc-rs build rustls already uses.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# Already compiled for s3s; see hmac.
sha2 = "0.11"
tempfile = "3"
# test-util: timeout tests pause the clock instead of waiting the timeouts out.
tokio = { version = "1", features = ["full", "test-util"] }
