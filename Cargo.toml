[package]
name = "s3dal"
version = "0.3.1"
edition = "2024"
# s3s 0.17 requires 1.96.
rust-version = "1.96"
license = "Apache-2.0"
description = "Expose any Apache OpenDAL backend as an S3-compatible endpoint"
repository = "https://github.com/linzeyan/s3dal"
readme = "README.md"
keywords = ["s3", "s3-compatible", "opendal", "object-storage", "gateway"]
categories = ["command-line-utilities", "network-programming", "web-programming::http-server"]
# An allowlist, so the package holds only what builds and documents the crate. Tests, scripts
# and compat/ results are for development in a checkout; NOTICE must travel with the code
# adapted from s3s.
include = [
    "/src/",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
]

[features]
default = ["services-s3", "services-azblob", "services-gcs", "client", "log-forward"]
# A remote service brings OpenDAL's HTTP transport with it; fs alone needs none, so each one
# that s3dal is tested against is a feature that a build can leave out.
services-s3 = ["opendal/services-s3", "opendal/http-transport-reqwest"]
services-azblob = ["opendal/services-azblob", "opendal/http-transport-reqwest"]
services-gcs = ["opendal/services-gcs", "opendal/http-transport-reqwest"]
# The `ls`, `cp`, ... subcommands. Every crate they need is already compiled for OpenDAL's s3
# service, so in the default build they cost little more than their own code.
client = [
    "dep:http",
    "dep:percent-encoding",
    "dep:quick-xml",
    "dep:reqsign-aws-v4",
    "dep:reqsign-core",
    "dep:reqwest",
    "tokio/fs",
    "tokio/io-std",
    "tokio/io-util",
]
# `--log-forward` over HTTP: Graylog's GELF HTTP input and Elasticsearch's bulk API. Over UDP and
# TCP it needs nothing more. Every crate it needs is already compiled for OpenDAL's s3 service.
log-forward = ["dep:percent-encoding", "dep:reqwest"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
# Already compiled for s3s. Continuation tokens are base64url of the last listed name, and
# Content-MD5 is base64 of the digest.
base64-simd = "0.8"
bytes = "1"
# `string`: values read from the config file become flag defaults at runtime. `wrap_help`: help
# text wraps at the terminal's width, where unwrapped it ran past the edge and the terminal's own
# wrapping put the rest of a line into the command column.
clap = { version = "4.6", features = ["derive", "env", "string", "wrap_help"] }
futures = "0.3"
# Already compiled for uuid. `keygen` draws key pairs from the OS generator.
getrandom = "0.4"
# Already compiled for reqwest. The client builds the request head that reqsign signs.
http = { version = "1", optional = true }
# Already compiled for s3s; wraps its service to fix up request headers before s3s parses them.
hyper = "1"
hyper-util = { version = "0.1.20", features = ["server-auto", "http1", "http2", "tokio"] }
md-5 = "0.11"
opendal = { version = "0.59.4", default-features = false, features = ["services-fs", "services-memory", "executors-tokio", "layers-retry"] }
# Already compiled for reqwest. The client escapes keys and query values as SigV4 canonicalizes
# them, so the URL sent and the URL signed agree.
percent-encoding = { version = "2.3", optional = true }
# Already compiled for s3s and reqsign, with `serialize`. The client reads S3's XML responses.
quick-xml = { version = "0.42", features = ["serialize"], optional = true }
# Already compiled for OpenDAL's s3 service, which signs its requests with them; the client
# signs its own, and presigns URLs, the same way.
reqsign-aws-v4 = { version = "3.3.1", default-features = false, optional = true }
reqsign-core = { version = "3.3.2", default-features = false, optional = true }
# Already compiled for OpenDAL's s3 service, with these features: the client's HTTP transport,
# with streamed bodies for uploads and downloads larger than memory.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"], optional = true }
s3s = "0.17.0"
# Already compiled for s3s, which decodes and encodes x-amz-meta-* values with it; s3dal stores
# them in the same encoded form.
s3s-rfc2047 = "0.17.0"
# Already compiled for opendal-core. Multipart uploads keep their state in small JSON files.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Already compiled for tokio, with `all`. Sets TCP keepalive timing on accepted sockets, which
# tokio does not expose, without unsafe setsockopt calls and the per-OS option names.
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# Already compiled for OpenDAL's s3 service (reqwest's TLS), with the same aws-lc-rs provider.
# Serves HTTPS, and re-exports rustls and its PEM parser.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
# Reads the `serve --config` file; the console writes it with toml_edit below.
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
# The console edits the config file. Unlike serializing with `toml`, it changes only the keys it
# sets and keeps the rest of the file, comments and layout included, as the operator wrote it.
# Shares its parser with `toml`.
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
tracing = "0.1"
# `json`: `--log-format json`, one object per line for log collectors.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
# Already compiled for OpenDAL's fs service, which keeps user metadata in xattrs with it.
# Listings read them the same way, in batches, instead of one OpenDAL stat per key.
xattr = "1.6.1"

# Already compiled for tokio. Bounds glibc's malloc arenas at startup (see main.rs).
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
aws-credential-types = { version = "1.3", features = ["hardcoded-credentials"] }
aws-sdk-s3 = { version = "1.143", features = ["behavior-version-latest"] }
# Already compiled for aws-sdk-s3; HTTPS tests give the SDK a client that trusts the test
# certificate.
aws-smithy-http-client = { version = "1.5", features = ["rustls-aws-lc"] }
# Already compiled for hyper. Connection tests speak HTTP/2 directly, to see a GOAWAY and to hold
# a request open halfway through its body, which the SDK does not expose.
h2 = "0.4"
# Already compiled for s3s. Browser form uploads are signed by the app's backend, not an SDK, so
# the tests sign their POST policies with HMAC-SHA256 themselves.
hmac = "0.13"
# Every test runs its own tokio runtime, and a pooled connection dies with the runtime that
# opened it, so each test backend gets an HTTP client of its own instead of OpenDAL's
# process-wide one. Both are already compiled for OpenDAL's s3 service.
opendal-http-transport-reqwest = "0.59.4"
reqwest = { version = "0.13.4", default-features = false }
# Generates TLS test certificates at test time, so no private key or expiry date is committed.
# Signs with the aws-lc-rs build rustls already uses.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# Already compiled for s3s; see hmac.
sha2 = "0.11"
tempfile = "3"
# test-util: timeout tests pause the clock instead of waiting the timeouts out.
tokio = { version = "1", features = ["full", "test-util"] }
