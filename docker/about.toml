# Licenses accepted for the crates compiled into the s3dal binary. cargo-about refuses any other,
# so a new dependency under an unexpected license stops the image build instead of shipping.
# For a crate offering a choice, the first license here that it offers is the one listed.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
]
# What the image ships: Linux binaries. Build scripts, proc macros and test-only crates are not
# part of them.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
